name: Recordatorios

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  recordatorios:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar recordatorios
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/api/cron/reminders"